name: Build HTD Mod Menu IPA

on:

  workflow_dispatch

jobs:

  build:

    runs-on: macos-14

    steps:

      - name: Checkout

        uses: actions/checkout@v4

      - name: Unzip project

        run: |

          unzip -o HTDModMenu_Xcode_Project.zip

      - name: Build app

        run: |

          cd HTDModMenu_Xcode_Project/HTDModMenu

          xcodebuild \

            -project HTDModMenu.xcodeproj \

            -scheme HTDModMenu \

            -configuration Release \

            -sdk iphoneos \

            -derivedDataPath build \

            CODE_SIGNING_ALLOWED=NO \

            build

      - name: Package IPA

        run: |

          mkdir -p Payload

          cp -R HTDModMenu_Xcode_Project/HTDModMenu/build/Build/Products/Release-iphoneos/HTDModMenu.app Payload/

          zip -r HTDModMenu.ipa Payload

      - name: Upload IPA

        uses: actions/upload-artifact@v4

        with:

          name: HTDModMenu-IPA

          path: HTDModMenu.ipa
